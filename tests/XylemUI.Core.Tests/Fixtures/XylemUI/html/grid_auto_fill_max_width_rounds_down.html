<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    With only a maximum width, auto-fill repeats as many times as fit in the maximum
  </title>
</head>
<body>

<div id="test-root" style="display: flex; width: 400px; align-items: flex-start;">
  <div style="display: grid; max-width: 230px; grid-template-columns: repeat(auto-fill, 50px);">
    <div style="height: 10px;"></div>
    <div style="height: 10px;"></div>
    <div style="height: 10px;"></div>
    <div style="height: 10px;"></div>
    <div style="height: 10px;"></div>
  </div>
</div>

</body>
</html>
