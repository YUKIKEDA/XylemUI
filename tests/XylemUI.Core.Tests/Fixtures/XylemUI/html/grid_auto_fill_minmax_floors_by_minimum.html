<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    auto-fill counts a minmax() track whose maximum is below its minimum at its minimum
  </title>
</head>
<body>

<div id="test-root" style="display: grid; width: 250px; grid-template-columns: repeat(auto-fill, minmax(100px, 50px));">
  <div style="height: 10px;"></div>
  <div style="height: 10px;"></div>
  <div style="height: 10px;"></div>
</div>

</body>
</html>
