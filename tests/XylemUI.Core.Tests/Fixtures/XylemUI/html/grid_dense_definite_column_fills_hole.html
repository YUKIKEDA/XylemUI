<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A dense flow places an item with only a column from the first row, into the hole above the cursor
  </title>
</head>
<body>

<div id="test-root" style="display: grid; grid-auto-flow: row dense; grid-template-columns: 50px 50px; grid-auto-rows: 10px;">
  <div style="grid-column-start: 2;"></div>
  <div style="grid-column-end: span 2;"></div>
  <div style="grid-column-start: 1;"></div>
</div>

</body>
</html>
