<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    An absolutely positioned child with a line and a span from it takes the tracks it spans as its containing block
  </title>
</head>
<body>

<div id="test-root" style="display: grid; position: relative; width: 300px; height: 20px; grid-template-columns: 50px 50px 50px;">
  <div style="position: absolute; grid-column-start: 1; grid-column-end: span 2; left: 0px; right: 0px; top: 0px; height: 10px;"></div>
</div>

</body>
</html>
