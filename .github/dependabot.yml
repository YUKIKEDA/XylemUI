version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    # The comparison apps pin their frameworks for the M1a baseline (docs/benchmarks/m1-baseline.md).
    exclude-paths:
      - "benchmarks/compare/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      analyzers:
        patterns:
          - "StyleCop.Analyzers"
          - "Microsoft.CodeAnalysis*"
      test:
        patterns:
          - "xunit*"
          - "Microsoft.Extensions.TimeProvider.Testing"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
