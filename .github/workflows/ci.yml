name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  gate:
    name: build.ps1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the merge gate. Linux and macOS run the same script for the layers that do not need a GPU (design §12.1).
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The sum of the limits of the two long steps below, with 5 minutes for the rest.
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The native libraries built by vendor/build.ps1 (Windows only until P04 / P06). The key covers the pinned versions and
      # the script, so a change to either builds them again.
      - uses: actions/cache/restore@v6
        id: vendor
        if: runner.os == 'Windows'
        with:
          path: |
            vendor/.cache
            vendor/out
          key: vendor-${{ runner.os }}-${{ hashFiles('vendor/versions.lock', 'vendor/build.ps1') }}

      # A run with no cache builds the libraries in a step of its own and saves them at once, before the gate: the build took
      # 14 minutes 26 seconds (Issue #770), which the gate's limit has no room for, and a run whose gate fails or is stopped
      # still leaves the cache for the next one (row Q12).
      - name: Native libraries
        if: runner.os == 'Windows' && steps.vendor.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: ./vendor/build.ps1

      - uses: actions/cache/save@v6
        if: runner.os == 'Windows' && steps.vendor.outputs.cache-hit != 'true'
        with:
          path: |
            vendor/.cache
            vendor/out
          key: ${{ steps.vendor.outputs.cache-primary-key }}

      # Trial step for the review of PR #777: the processors of the runner. Removed before the PR is ready.
      - name: Processors
        run: Write-Host "ProcessorCount $([Environment]::ProcessorCount)"

      # A gate that hangs is stopped after 30 minutes, with or without the cache.
      - name: Gate
        timeout-minutes: 30
        run: ./build.ps1

      # The dump that build.ps1 writes when the Desktop tests hang (row Q5).
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Windows'
        with:
          name: hangdump-${{ github.run_attempt }}
          path: artifacts/hangdump
          if-no-files-found: ignore
          retention-days: 14

      # The screenshots and the differences of the goldens that did not match (design §12.3, row P02a2).
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Windows'
        with:
          name: golden-failures-${{ github.run_attempt }}
          path: tests/*/bin/*/*/GoldenFailures
          if-no-files-found: ignore
          retention-days: 14
