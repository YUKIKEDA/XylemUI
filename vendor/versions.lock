# Native libraries built from source by vendor/build.ps1 (design §9). One library per line:
# name  version  sha256  url  [mirror url ...]
# The URLs are tried in order; every download is checked against the SHA-256. Changing a line rebuilds the library.
# A version is taken once it has been out for two weeks, except a security fix, which is taken at once
# (.cursor/rules/dependencies.mdc).
# A line whose name has no CMake options in vendor/build.ps1 is data, not a library: unicode-ucd is the Unicode Character
# Database that tools/UnicodeTableGen generates the text pipeline's tables from (design §8.13).
