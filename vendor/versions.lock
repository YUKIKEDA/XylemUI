# Native libraries that vendor/build.ps1 builds from source, or takes prebuilt from a release archive (design §9). One per line:
# name  version  sha256  url  [mirror url ...]
# The URLs are tried in order; every download is checked against the SHA-256. Changing a line rebuilds the library. A GitHub
# release asset lists its API URL after its download URL: the same file through another host, which answered while the download
# host gave 504 to every request (Issue #733).
# A version is taken once it has been out for two weeks, except a security fix, which is taken at once
# (.cursor/rules/dependencies.mdc).
# AccessKit is not built: the release archive of its C bindings holds the libraries for MSVC, which are taken as they are
# (design §4.4.1, row P02g). A line whose name has neither CMake options nor prebuilt paths in vendor/build.ps1 is data, not a
# library: unicode-ucd is the Unicode Character Database that tools/UnicodeTableGen generates the text pipeline's tables from
# (design §8.13). The fluent-* lines are the files of Fluent UI System Icons (MIT, release 1.1.344, commit a347af9) that
# vendor/build.ps1 copies to vendor/out/fluent: the two fonts the build tool of XylemUI.Theme.Fluent keeps an app's glyphs of,
# and the two maps from names to code points that FluentIcons.g.cs is generated from (design §5.0.4). The fluent-tokens-* lines
# are the files of packages/tokens/src of microsoft/fluentui (MIT, @fluentui/tokens 1.0.0-alpha.24, commit 1f59fc2) that
# vendor/build.ps1 copies to vendor/out/fluent/tokens at their paths, and that tools/FluentTokensTool generates FluentTokens.g.cs from
# (design §13.2); each SHA-256 is that of the file at the commit. The image decoders (design
# §5.0.4, row IM1): wuffs is the one C file of a Wuffs release, which native/imaging/xylemui_image.c includes; libjpeg-turbo and
# libwebp are the tag archives; nasm is the assembler libjpeg-turbo's SIMD needs, taken onto the PATH and never shipped. The
# skcms-* lines are the files of skcms (BSD-3), which the shim converts embedded color profiles to sRGB with (design §5.0.4, IM1's
# Grill, Q28), and skia-license is Skia's LICENSE that covers them: skcms has no tagged versions, so the files are taken one by one
# from Skia's commit 8df24be (2026-07-08), the one Flutter 3.47.8 pins. llvm is LLVM's release for Windows, of which vendor/build.ps1
# takes clang-cl alone to compile skcms, taken onto no PATH and never shipped: skcms writes its SIMD with Clang's and GCC's vector
# extensions, and under MSVC it falls back to scalar code (SKCMS_PORTABLE) without its AVX2 and AVX-512 transforms. Skia builds
# with clang on Windows too. Converting 12.2 million pixels from Display P3 to sRGB took 6.3 to 6.6 ns a pixel with clang-cl, and
# 39.5 to 41.4 ns with MSVC (IM1's Grill, Q31).
