# Native libraries that vendor/build.ps1 builds from source, or takes prebuilt from a release archive (design §9). One per line:
# name  version  sha256  url  [mirror url ...]
# The URLs are tried in order; every download is checked against the SHA-256. Changing a line rebuilds the library.
# A version is taken once it has been out for two weeks, except a security fix, which is taken at once
# (.cursor/rules/dependencies.mdc).
# AccessKit is not built: the release archive of its C bindings holds the libraries for MSVC, which are taken as they are
# (design §4.4.1, row P02g). A line whose name has neither CMake options nor prebuilt paths in vendor/build.ps1 is data, not a
# library: unicode-ucd is the Unicode Character Database that tools/UnicodeTableGen generates the text pipeline's tables from
# (design §8.13).
